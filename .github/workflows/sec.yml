# ============================================================
#  >>> DESTINATION: TheMostLocal/TRAPP2-ANALYTICS
#  >>> FILE PATH:   .github/workflows/sec.yml
#  z158 - SEC EDGAR (8-K events, Form 4 insiders, XBRL facts as filed) and FINRA short selling (daily short
#  volume; short interest when the API tier allows). Weekdays 0705 ET (overnight filings) and 1810 ET (the
#  day's filings + FINRA's daily short-volume file, posted ~1800 ET). ET-gated twin crons.
#  Secrets: SEC_USER_AGENT (already set), FINRA_CLIENT_ID / FINRA_CLIENT_SECRET (add to this repo for short interest).
#  z199 - Schedule 13D / 13G (who owns 5 %+ of each company) and the SEC profile ride the same run. Their offline
#  self-test runs first: if it fails, the ownership read is switched off for that run (SEC_SCHED13_DOCS=0) - the rest
#  of the SEC refresh still runs.
#  z202 - market cap by the formula (pipeline/shares.py): the SEC's own share counts (XBRL frames, 3 requests) x the
#  books' price, checked against Yahoo -> data/sec/shares.json (the app's market caps; Yahoo kept where they disagree).
# ============================================================
name: SEC filings + short selling

on:
  schedule:
    - cron: '5 11 * * 1-5'     # 0705 EDT
    - cron: '5 12 * * 1-5'     # 0705 EST
    - cron: '10 22 * * 1-5'    # 1810 EDT
    - cron: '10 23 * * 1-5'    # 1810 EST
  workflow_dispatch:

concurrency:
  group: analytics-sec
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read                 # z189: to see whether the on-time run already started
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Eastern-time gate (+ z189 late-start check)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          S="${{ github.event.schedule }}"; OFF=$(TZ=America/New_York date +%z); OFFH=$((10#${OFF:1:2}))
          UM=$(echo "$S" | awk '{print $1}'); UH=$(echo "$S" | awk '{print $2}')
          ETH=$(( (10#$UH - OFFH + 24) % 24 )); ETM=$(printf '%02d' "$UM")
          case " 7:05 18:10 " in *" ${ETH}:${ETM} "*) RUN=true ;; *) RUN=false ;; esac
          echo "schedule '$S' = ${ETH}:${ETM} ET -> run=${RUN}"
          # z189: TRAPP2-ANALYTICS' 24/7 health loop (pipeline/ontime.py) queues this workflow at its slot -
          # GitHub starts this account's crons 6-7 h late. A late scheduled start stands down when an on-time or manual run has
          # started since the slot (one that failed or was cancelled doesn't count - then this late start is the retry).
          # Can't tell -> run.
          if [ "$RUN" = true ]; then
            SLOT=$(date -u -d "$(date -u +%F) $(printf '%02d:%02d' "$((10#$UH))" "$((10#$UM))")" +%s); NOW=$(date -u +%s)
            [ "$SLOT" -gt "$NOW" ] && SLOT=$(( SLOT - 86400 ))
            SINCE=$(date -u -d "@$(( SLOT - 600 ))" +%Y-%m-%dT%H:%M:%SZ)
            WF="${GITHUB_WORKFLOW_REF%@*}"; WF="${WF##*/}"
            N=$(gh run list -R "$GITHUB_REPOSITORY" -w "$WF" -L 30 --json databaseId,event,createdAt,conclusion \
                  --jq "[.[] | select(.event == \"workflow_dispatch\" and .createdAt >= \"$SINCE\" and .databaseId != $GITHUB_RUN_ID and .conclusion != \"failure\" and .conclusion != \"cancelled\" and .conclusion != \"timed_out\")] | length" 2>/dev/null || true)
            echo "slot $(date -u -d "@$SLOT" +%H:%M) UTC · this start $(( (NOW - SLOT) / 60 )) min after it · on-time / manual runs since: ${N:-unknown}"
            if [ -n "$N" ] && [ "$N" -gt 0 ] 2>/dev/null; then RUN=false; echo "already ran on time - this late start stands down"; fi
          fi
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"

  sec:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-test - Schedule 13D / 13G reader (offline, < 1 s; a failure switches the ownership read off, not the run)
        run: python tests/test_sec.py || { echo "::warning::13D/13G self-test failed - ownership read off this run"; echo "SEC_SCHED13_DOCS=0" >> "$GITHUB_ENV"; }
      - name: SEC - 8-K events, Form 4 insiders, XBRL facts, 13D / 13G holders
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: python pipeline/fetch_sec.py
        continue-on-error: true
      - name: Market cap by the formula - price x the SEC's share count, checked against Yahoo (z202; self-test first)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: |
          if python tests/test_shares.py; then python pipeline/shares.py || echo "::warning::shares run failed - data/sec/shares.json kept as it was"
          else echo "::warning::shares self-test failed - data/sec/shares.json kept as it was"; fi
        continue-on-error: true
      - name: FINRA - short volume and short interest (z207; self-test first - paging, newest settlement, split, z)
        env:
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
        run: |
          if python tests/test_short.py; then python pipeline/fetch_short.py
          else echo "::warning::short self-test failed - data/short/index.json kept as it was"; fi
        continue-on-error: true
      - name: Commit & push
        run: |
          git config user.name "valuatio-sec"; git config user.email "actions@github.com"
          for p in data/sec data/short; do [ -e "$p" ] && git add -A "$p"; done
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -q -m "sec + short: $(TZ=America/New_York date +%Y-%m-%d\ %H%M) ET [skip ci]"
          for k in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then echo "pushed (attempt $k)"; exit 0; fi
            git fetch -q origin main; git merge -X ours origin/main --no-edit -q || true; sleep $((k * 3))
          done
          echo "::warning::push failed after 5 attempts"
