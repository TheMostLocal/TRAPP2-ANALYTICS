name: Push analytics → Supabase

# Pushes the analytics backend into the TRAPP2-ANALYTICS Supabase project:
#   research_grades · regime_snapshots · regime_timeline · analytics_kv (macro).
# research_grades is read from this repo's checkout; regime + macro are fetched
# live from TRAPP2-1 (the canonical source), so no extra checkouts are needed.

# z189: `on: push` only fires for YOUR pushes - a push made with a workflow's own token starts nothing, so
# Analytics queues this sync itself after each run (and the health loop queues it every hour at :20).
on:
  push:
    paths: [ 'data/research_grades.json' ]
  schedule:
    - cron: '20 * * * *'        # hourly at :20 (≥ daily, so regime pushes daily) - z189: queued on time by the health loop
  workflow_dispatch:

jobs:
  gate:
    # z189: TRAPP2-ANALYTICS' health loop (pipeline/ontime.py) queues this sync every hour on time, and Analytics queues
    # it right after new grades. A late scheduled start (GitHub runs this account's crons hours late) stands down when a
    # queued run started in the last 50 min (not one that failed or was cancelled). Can't tell -> run. The concurrency
    # group sits on the sync job, so a late start that stands down never cancels a sync in progress.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Late-start check (z189)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SINCE=$(date -u -d "@$(( $(date -u +%s) - 3000 ))" +%Y-%m-%dT%H:%M:%SZ)
            WF="${GITHUB_WORKFLOW_REF%@*}"; WF="${WF##*/}"
            N=$(gh run list -R "$GITHUB_REPOSITORY" -w "$WF" -L 30 --json databaseId,event,createdAt,conclusion \
                  --jq "[.[] | select(.event == \"workflow_dispatch\" and .createdAt >= \"$SINCE\" and .databaseId != $GITHUB_RUN_ID and .conclusion != \"failure\" and .conclusion != \"cancelled\" and .conclusion != \"timed_out\")] | length" 2>/dev/null || true)
            echo "queued (on-time / manual) runs since $SINCE: ${N:-unknown}"
            if [ -n "$N" ] && [ "$N" -gt 0 ] 2>/dev/null; then RUN=false; echo "synced within the hour - this late start stands down"; fi
          fi
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:                    # z189: on the job (was the workflow), so a gate that stands down cancels nothing
      group: analytics-supabase
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Push to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          # Authenticates the macro-series auto-discovery call (api.github.com),
          # so it never trips the shared-runner unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 pipeline/sync_analytics_to_supabase.py
