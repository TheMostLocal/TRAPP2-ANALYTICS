# ============================================================
#  >>> DESTINATION: TheMostLocal/TRAPP2-ANALYTICS
#  >>> FILE PATH:   .github/workflows/health.yml
#  z157 data health; z168 - one job checks every 30 minutes for ~170 minutes and queues its own next run
#  (pipeline/health_loop.sh), so the Home card no longer depends on GitHub starting each 30-minute schedule.
#  The schedule stays as a backstop; while a loop runs, a scheduled start just waits (never cancels it).
# ============================================================
name: Data health (every input, every repo)

on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:

concurrency:
  group: analytics-health
  cancel-in-progress: false        # z168: a backstop start must never cancel the running loop

permissions:
  contents: write
  actions: write                   # z168: the loop queues its own next run

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every input, every 30 minutes, then queue the next run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}                    # z159: the live tables' freshness too
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          GH_TOKEN: ${{ github.token }}
          LOOP_BUDGET_MIN: '170'
        run: bash pipeline/health_loop.sh
