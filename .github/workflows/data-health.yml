# ============================================================
#  >>> DESTINATION: TheMostLocal/TRAPP2-ANALYTICS
#  >>> FILE PATH:   .github/workflows/health.yml
#  z157 - DATA HEALTH every 30 min (at :19 / :49, off GitHub's busy minutes): every input the app and
#  the bot read, across all repos, against what its schedule promises. -> data/health.json
# ============================================================
name: Data health (every input, every repo)

on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:

concurrency:
  group: analytics-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every input
        run: python pipeline/data_health.py
      - name: Commit & push
        run: |
          git config user.name "valuatio-health"
          git config user.email "actions@github.com"
          git add data/health.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -q -m "health: $(TZ=America/New_York date +%Y-%m-%d\ %H%M) ET [skip ci]"
          for k in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then echo "pushed (attempt $k)"; exit 0; fi
            git fetch -q origin main; git merge -X ours origin/main --no-edit -q || true; sleep $((k * 3))
          done
          echo "::warning::push failed after 5 attempts"
