# ============================================================
#  >>> DESTINATION: TheMostLocal/TRAPP2-ANALYTICS
#  >>> FILE PATH:   .github/workflows/analytics.yml
#
#  z189 - ON TIME. GitHub started this workflow's 03:00 UTC cron ~10:30 UTC (11-10..11-16). TRAPP2-ANALYTICS' 24/7
#  health loop (pipeline/ontime.py) now queues it at 03:00 UTC after a trading day - as soon as all five books'
#  Nightlies have committed (forced at 09:00 UTC) - and at 14:30 UTC on weekdays. The gate lets the late scheduled
#  start stand down when that run already happened. And because a push made with the job's own token never fires
#  another workflow's `on: push`, the Supabase mirrors (research_grades, ticker_snapshot) are queued at the end of
#  the run instead of waiting for their hourly schedule.
#  (Push logic: `git fetch` + `git merge -X ours`, never leaves unmerged files.)
#  z203 - + market statistics from the books' own histories (pipeline/derived.py -> data/derived/market.json).
#  z204 - + fundamentals and multiples as filed, checked against Yahoo (pipeline/fundamentals.py -> data/derived/fundamentals.json).
# ============================================================

# .github/workflows/analytics.yml  →  goes in the NEW TRAPP2-ANALYTICS repo
#
# The analytics backend: computes research grades (the Research tab's 23
# metrics, percentile ranks, and letter grades) across ALL THREE books, and
# pulls the news corpus — so the frontend's job shifts to comparing, verifying,
# and flagging discrepancies instead of computing and fetching everything.
#
# Scheduled AFTER the data repos' nightly refreshes (which start 00:30 UTC), so
# it computes on tonight's data, not yesterday's.
#
# REPO SETUP: create repo TRAPP2-ANALYTICS, add:
#   pipeline/compute_research.py
#   pipeline/fetch_news.py
#   requirements.txt        (contents: yfinance)
#   .github/workflows/analytics.yml   (this file)
name: Analytics refresh

on:
  schedule:
    - cron: '0 3 * * *'        # 03:00 UTC — after the 00:30 nightly chains (z189: queued on time by the health loop)
    - cron: '30 14 * * 1-5'    # 14:30 UTC weekdays — midday news top-up
  workflow_dispatch:

permissions:
  contents: write
  actions: write                   # z189: the gate reads this workflow's runs; the last step queues the Supabase syncs

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        name: Late-start check (z189)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            S="${{ github.event.schedule }}"
            UM=$(echo "$S" | awk '{print $1}'); UH=$(echo "$S" | awk '{print $2}')
            # z189: TRAPP2-ANALYTICS' 24/7 health loop (pipeline/ontime.py) queues this workflow at its slot -
            # GitHub starts this account's crons 6-7 h late. A late scheduled start stands down when an on-time or manual run has
            # started since the slot (one that failed or was cancelled doesn't count - then this late start is the retry).
            # Can't tell -> run.
            if [ "$RUN" = true ]; then
              SLOT=$(date -u -d "$(date -u +%F) $(printf '%02d:%02d' "$((10#$UH))" "$((10#$UM))")" +%s); NOW=$(date -u +%s)
              [ "$SLOT" -gt "$NOW" ] && SLOT=$(( SLOT - 86400 ))
              SINCE=$(date -u -d "@$(( SLOT - 600 ))" +%Y-%m-%dT%H:%M:%SZ)
              WF="${GITHUB_WORKFLOW_REF%@*}"; WF="${WF##*/}"
              N=$(gh run list -R "$GITHUB_REPOSITORY" -w "$WF" -L 30 --json databaseId,event,createdAt,conclusion \
                    --jq "[.[] | select(.event == \"workflow_dispatch\" and .createdAt >= \"$SINCE\" and .databaseId != $GITHUB_RUN_ID and .conclusion != \"failure\" and .conclusion != \"cancelled\" and .conclusion != \"timed_out\")] | length" 2>/dev/null || true)
              echo "slot $(date -u -d "@$SLOT" +%H:%M) UTC · this start $(( (NOW - SLOT) / 60 )) min after it · on-time / manual runs since: ${N:-unknown}"
              if [ -n "$N" ] && [ "$N" -gt 0 ] 2>/dev/null; then RUN=false; echo "already ran on time - this late start stands down"; fi
            fi
          fi
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75                 # z178: +TRAPP2-4 (research, patterns, ~400 more news names)
    steps:
      - uses: actions/checkout@v4

      # Check out all three data books locally — compute_research v2 reads
      # master.json AND data/history/*.json straight from disk (no HTTP),
      # which is what powers technicals + non-equity grading.
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/TRAPP2", path: books/TRAPP2 }
      # z206: the macro book may be unreadable (11-24: every TRAPP2-1 file 404) - the other four books' grades, market
      # statistics, fundamentals and factors still run (the research grades read TRAPP2-1 over HTTP when it isn't
      # checked out, market statistics take TRAPP2's SPY as the benchmark).
      - uses: actions/checkout@v4
        continue-on-error: true
        with: { repository: "${{ github.repository_owner }}/TRAPP2-1", path: books/TRAPP2-1 }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/TRAPP2-2", path: books/TRAPP2-2 }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/TRAPP2-3", path: books/TRAPP2-3 }
      - uses: actions/checkout@v4          # z178: the NYSE equities that weren't in the app
        with: { repository: "${{ github.repository_owner }}/TRAPP2-4", path: books/TRAPP2-4 }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Compute research grades (cross-book)
        run: python pipeline/compute_research.py

      # z203: market statistics by the formula - 52-week closing range, averages, volume, volatility, beta (60
      # completed months, Yahoo's method / 252 sessions), returns, drawdown - from the books' own histories checked
      # out above, checked against Yahoo's figures -> data/derived/market.json (fills the master rows' blank 52-week
      # high / low and beta in the app). Self-test first; a failure here never blocks the grades commit.
      - name: Market statistics from our histories (z203)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if python tests/test_derived.py; then
            python pipeline/derived.py || echo "::warning::derived.py failed - data/derived/market.json not refreshed"
          else
            echo "::warning::derived self-test failed - data/derived/market.json not refreshed"
          fi

      # z206: the factor monitor - who was forced to trade: the most-shorted 50, 12-1 momentum, the week's losers vs
      # winners, high vs low beta, each session's spread over a year from the books' own histories, the baskets for the
      # next session (pipeline/trends.py prices them live) and the crowded shorts the bot reads -> data/derived/factors.json.
      - name: Factor monitor (z206)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if python tests/test_factors.py; then
            python pipeline/factors.py || echo "::warning::factors.py failed - data/derived/factors.json not refreshed"
          else
            echo "::warning::factors self-test failed - data/derived/factors.json not refreshed"
          fi

      # z204: fundamentals and multiples AS FILED - the trailing twelve months and the latest balance sheet from the
      # SEC filings (data/sec, this repo), checked against Yahoo's figures in the books' masters on the same period,
      # with the pick the bot and the app follow -> data/derived/fundamentals.json. Self-test first; never blocks.
      - name: Fundamentals as filed (z204)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if python tests/test_fundamentals.py; then
            python pipeline/fundamentals.py || echo "::warning::fundamentals.py failed - data/derived/fundamentals.json not refreshed"
          else
            echo "::warning::fundamentals self-test failed - data/derived/fundamentals.json not refreshed"
          fi

      # Human grades (XTRAPP, 3-month TTL) outrank computed grades. The machine
      # grade is kept in _machine; bot + Supabase ticker_snapshot read the result.
      - name: Apply human grades (XTRAPP)
        run: python pipeline/human_corrections.py grades
        continue-on-error: true

      # Technical templates & chart patterns (WIP, patterns-v1): Minervini trend
      # template, head & shoulders (top / inverse), double top / bottom over every
      # ticker's full history from the books checked out above - no lookahead,
      # each identification judged by what happened next. Writes
      # data/patterns/ (current, signals, stats, records/, append-only live ledger).
      - name: Scan patterns & templates
        run: python pipeline/scan_patterns.py
        continue-on-error: true
        timeout-minutes: 35             # z178: +1,600 histories to scan

      - name: Pull news corpus
        # Best-effort — a Yahoo hiccup shouldn't block the grades commit.
        run: python pipeline/fetch_news.py || echo "news step had errors but continuing"

      - name: Commit & push
        run: |
          git config user.name "valuatio-analytics"
          git config user.email "actions@github.com"
          rm -rf books
          git add -A data/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "analytics: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Conflict-proof push (fetch + merge -X ours, latest run wins). Avoids
          # the rebase-conflict / unmerged-files failure on regenerated JSON.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main 2>/dev/null || git push; then echo "Pushed (attempt $i)"; break; fi
            git fetch origin "${GITHUB_REF_NAME:-main}" || git fetch origin main
            git merge -X ours --no-edit "origin/${GITHUB_REF_NAME:-main}" 2>/dev/null || git merge -X ours --no-edit origin/main 2>/dev/null || git merge --abort 2>/dev/null || true
            sleep $((i * 2))
          done

      # z189: a push made with this job's token never starts another workflow's `on: push`, so research_grades and
      # ticker_snapshot in Supabase (the app reads grades from there first) waited for their hourly crons - which this
      # account's GitHub starts hours late. Queue both now: Supabase has tonight's grades within minutes.
      - name: Queue the Supabase mirrors (research_grades, ticker_snapshot)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in supabase-sync.yml ticker-snapshot-sync.yml; do
            if gh workflow run "$wf" --ref "${GITHUB_REF_NAME:-main}" -R "$GITHUB_REPOSITORY"; then echo "queued $wf"
            else echo "::warning::could not queue $wf"; fi
          done
